# Separate from ci.yml on purpose: editing a pull request's title or body must
# not trigger a build and test run, and this needs neither a checkout nor an
# install.
name: PR Lint
# `synchronize` fires on every push to the pull request head and re-answers a
# question only `opened` and `edited` can change. It is kept anyway: a
# required status check is recorded against the head SHA, so dropping it
# would leave the check missing on the commit that gets merged once branch
# protection exists.
on:
  pull_request:
    types:
      - opened
      - edited
      - synchronize
      - reopened
permissions:
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-pr-metadata:
    name: Validate PR metadata
    runs-on: ubuntu-latest
    # One API call's worth of work; the default is 360 minutes of billed
    # runner time if it ever hangs.
    timeout-minutes: 5
    steps:
      # The title is what lands on main: merges are squash-only and take the
      # pull request title as the commit subject, so a title that is not a
      # conventional commit is a history defect, not a cosmetic one.
      - name: Verify conventional commit-compliant PR title
        uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
