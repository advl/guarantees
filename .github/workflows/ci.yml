name: CI
on:
  push:
    branches: [main]
  # No base-branch filter. The filter here matches the branch a pull request
  # TARGETS, so `branches: [main]` gates only what is opened against main —
  # and a pull request opened against another branch, which is what every
  # rung of a stack is, runs nothing while still showing a green check for
  # whatever else did run. A change is gated because it is a change, not
  # because of what it happens to be based on.
  pull_request:

# A superseded run proves nothing, so in-flight runs on branches are
# cancelled. Runs on main are kept: each one is the record that a merge was
# green, and a merge that lands while the previous run is in flight must not
# erase it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# `pull-requests: read` is what the secret scan needs, and it is a READ scope
# rather than the write one the job turns comments off to avoid: scanning a
# pull request means enumerating its commits, which is a pulls API call the
# default token cannot make under `contents` alone. Without it the job dies
# on a 403 that reads like a leak and is not one.
permissions:
  contents: read
  pull-requests: read

jobs:
  gate:
    name: Gate
    runs-on: ubuntu-latest
    # Real work here is under a minute; anything past this is a hung process,
    # and the default is 360 minutes of billed runner time.
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.13"

      # Bun runs the scripts, but not every tool a script reaches: `tsc` is a
      # `#!/usr/bin/env node` executable and runs under whatever Node is on
      # PATH. Declaring the version turns an inherited property of the runner
      # image into a property of this repository, and it is the version the
      # manifest's `engines` promises. It is free, because the version is in
      # the runner's tool cache.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Only the download cache is worth restoring. A node_modules cache would
      # be a large many-file restore that the unconditional install below then
      # repeats, whereas a warm download cache makes that install a local
      # copy. The restore-keys prefix means a lockfile change is a delta rather
      # than a full refetch.
      - name: Cache Bun global cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-cache-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-cache-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # One target, and this file never names what it runs. `ci` is the gate
      # the manifest declares for itself, so a gate that is added there is
      # enforced here without this file changing — and a gate this file named
      # instead could be added to the manifest and never run, with nothing to
      # say so.
      - name: Gate
        run: bun run ci

  # A job of its own, and for a reason: it answers a different question about
  # a different input. It reads git history rather than the worktree, needs
  # no dependency install, and must still report when the install or the
  # build fails — folding it into the job above would make a secret scan
  # conditional on the toolchain resolving. The price is a second checkout of
  # the same tree, paid deliberately.
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # gitleaks scans history, not the worktree, so the full clone is the
      # point rather than an optimisation to be traded away.
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # The action comments on the pull request by default, which needs
      # `pull-requests: write` — a scope the workflow-level block above denies
      # and this job has no other use for. Turning comments off keeps the job
      # read-only; a leak still fails the job, which is the gate.
      - name: Scan for committed secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
